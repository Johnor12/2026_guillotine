[project]
name = "guillotine-2026"
version = "0.1.0"
description = "Draft and in-season decision models for a 32-team 0.5 PPR guillotine league"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

# Three flat packages at the repository root, installed editable by `uv sync` so
# `uv run -m <package>.<module>` works from any directory in the project.
[tool.uv.build-backend]
module-root = ""
module-name = ["shared", "draft", "season"]
